<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" width="560" height="200" role="img" aria-label="Pomodoro for Spotify Car Thing">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d2724"/>
      <stop offset="1" stop-color="#151012"/>
    </linearGradient>
    <radialGradient id="knob" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#5a524e"/>
      <stop offset="0.55" stop-color="#2c2623"/>
      <stop offset="1" stop-color="#14100f"/>
    </radialGradient>
    <radialGradient id="tomato" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#ff6a4d"/>
      <stop offset="0.55" stop-color="#ec3a2c"/>
      <stop offset="1" stop-color="#c62a22"/>
    </radialGradient>
    <linearGradient id="screenGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17120f"/>
      <stop offset="1" stop-color="#090809"/>
    </linearGradient>
  </defs>

  <!-- Car Thing device -->
  <g>
    <!-- rotary dial, protruding on the right -->
    <circle cx="176" cy="100" r="31" fill="url(#knob)" stroke="#0e0b0a" stroke-width="2"/>
    <circle cx="176" cy="100" r="22" fill="none" stroke="#000000" stroke-opacity="0.35" stroke-width="2"/>
    <rect x="173.5" y="80" width="5" height="12" rx="2.5" fill="#d9d2cc" opacity="0.85"/>

    <!-- body -->
    <rect x="28" y="46" width="130" height="108" rx="18" fill="url(#body)" stroke="#3a322e" stroke-width="1.5"/>

    <!-- top buttons -->
    <g fill="#4c4440">
      <rect x="50" y="54" width="16" height="7" rx="3.5"/>
      <rect x="74" y="54" width="16" height="7" rx="3.5"/>
      <rect x="98" y="54" width="16" height="7" rx="3.5"/>
      <rect x="122" y="54" width="16" height="7" rx="3.5"/>
    </g>

    <!-- screen -->
    <rect x="40" y="70" width="106" height="72" rx="9" fill="url(#screenGlow)"/>

    <!-- progress ring around the tomato -->
    <g transform="rotate(-90 93 107)">
      <circle cx="93" cy="107" r="28" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="5"/>
      <circle cx="93" cy="107" r="28" fill="none" stroke="#ff6a3d" stroke-width="5"
              stroke-linecap="round" stroke-dasharray="120 56" pathLength="176"/>
    </g>

    <!-- tomato (pomodoro) -->
    <g>
      <ellipse cx="93" cy="110" rx="21" ry="19" fill="url(#tomato)"/>
      <path d="M93 93 l4 -8 l1 7 l7 -4 l-4 7 l8 1 l-7 4 l-9 0 l-9 1 l-6 -5 l8 -1 l-4 -7 l7 4 l1 -7 Z"
            fill="#3fae46" stroke="#2c7f36" stroke-width="0.8" stroke-linejoin="round"/>
      <rect x="91.5" y="83" width="3" height="7" rx="1.5" fill="#2c7f36"/>
      <ellipse cx="85" cy="103" rx="5" ry="3.5" fill="#ffffff" opacity="0.28"/>
    </g>
  </g>

  <!-- wordmark -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="232" y="104" font-size="54" font-weight="800" fill="#ef4e2a" letter-spacing="-1">Pomodoro</text>
    <text x="234" y="132" font-size="15" font-weight="700" fill="#8b8b8b" letter-spacing="3.5">FOR SPOTIFY CAR THING</text>
  </g>
</svg>
