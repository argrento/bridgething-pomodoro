name: Build

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # tsc --noEmit then vite build
      - run: npm run build

      # Keep the built webapp from every build as a downloadable artifact.
      - uses: actions/upload-artifact@v4
        with:
          name: pomodoro-webapp
          path: dist
          if-no-files-found: error
